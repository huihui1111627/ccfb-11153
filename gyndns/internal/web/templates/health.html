{{template "head" .}}
<div class="card">
  <h3>健康检查 <button class="gray" onclick="load()">刷新</button></h3>
  <p class="muted">连续 2 次检查失败的地址会自动从解析结果中摘除;恢复后自动加回。可以手动强制下线/上线做故障演练,清除后恢复自动检查。</p>
  <table id="ht">
    <thead><tr><th>记录</th><th>检查目标</th><th>状态</th><th>连续失败</th><th>最近检查</th><th>最近错误</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
async function load() {
  const rows = await api('GET', '/api/health');
  const tb = document.querySelector('#ht tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="7" class="muted">暂无带健康检查的记录(在记录管理里给 A/AAAA 记录填检查目标)</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(r => {
    const up = r.forced !== null && r.forced !== undefined ? r.forced : r.up;
    const label = r.forced !== null && r.forced !== undefined
      ? (r.forced ? '<span class="up">强制在线</span>' : '<span class="down">强制下线</span>')
      : (r.up ? '<span class="up">正常</span>' : '<span class="down">故障</span>');
    return `<tr>
      <td>${esc(r.rec_key)}</td><td>${esc(r.check)}</td><td>${label}</td>
      <td>${r.failures}</td>
      <td class="muted">${r.last_check ? new Date(r.last_check).toLocaleTimeString() : '-'}</td>
      <td class="muted">${esc(r.last_error || '')}</td>
      <td>
        <button class="red" onclick='override(${JSON.stringify(r.rec_key)}, false)'>强制下线</button>
        <button onclick='override(${JSON.stringify(r.rec_key)}, true)'>强制上线</button>
        <button class="gray" onclick='override(${JSON.stringify(r.rec_key)}, null)'>清除</button>
      </td></tr>`;
  }).join('');
}
async function override(key, up) {
  try {
    await api('POST', '/api/health/override', { rec_key: key, up });
    toast('已设置', true); load();
  } catch (e) { toast(e.message, false); }
}
load();
setInterval(load, 5000);
</script>
{{template "foot" .}}
