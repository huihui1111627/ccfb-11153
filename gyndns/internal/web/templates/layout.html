{{define "head"}}<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>gyndns 管理</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  nav { background: #1f2937; color: #fff; padding: 0 20px; display: flex; gap: 4px; align-items: center; }
  nav .brand { font-weight: 700; padding: 14px 18px 14px 0; }
  nav a { color: #cbd5e1; text-decoration: none; padding: 14px 14px; display: inline-block; }
  nav a.active, nav a:hover { color: #fff; background: #374151; }
  nav .role { margin-left: auto; font-size: 12px; background: #4b5563; border-radius: 4px; padding: 2px 8px; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #e5e7eb; padding: 6px 10px; text-align: left; font-size: 13px; }
  th { background: #f3f4f6; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button.gray { background: #6b7280; }
  button.red { background: #dc2626; }
  input, select, textarea { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .up { color: #16a34a; font-weight: 600; }
  .down { color: #dc2626; font-weight: 600; }
  .muted { color: #6b7280; font-size: 12px; }
  .trace { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  #msg { position: fixed; top: 10px; right: 10px; padding: 10px 16px; border-radius: 6px; display: none; z-index: 9; }
  #msg.ok { background: #dcfce7; color: #166534; display: block; }
  #msg.err { background: #fee2e2; color: #991b1b; display: block; }
</style>
</head>
<body>
<nav>
  <span class="brand">gyndns</span>
  <a href="/zones" {{if eq .Page "zones"}}class="active"{{end}}>域名区</a>
  <a href="/records" {{if eq .Page "records"}}class="active"{{end}}>记录管理</a>
  <a href="/health" {{if eq .Page "health"}}class="active"{{end}}>健康检查</a>
  <a href="/logs" {{if eq .Page "logs"}}class="active"{{end}}>解析日志</a>
  <a href="/sync" {{if eq .Page "sync"}}class="active"{{end}}>主从同步</a>
  <span class="role">{{.Role}}</span>
</nav>
<div id="msg"></div>
<main>
{{end}}

{{define "foot"}}
</main>
<script>
function toast(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  setTimeout(() => { m.className = ''; m.style.display='none'; }, 3000);
  m.style.display = 'block';
}
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const resp = await fetch(url, opt);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || resp.statusText);
  return data;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
{{end}}
